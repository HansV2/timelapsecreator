name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'corretto'

      - name: Build with Maven
        run: mvn package

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/timelapsecreator.exe
            target/timelapsecreator-linux
            target/timelapsecreator-mac.command